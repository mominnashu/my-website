<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RiskProtect</title><link rel="stylesheet" href="popup.css"></head><body><main><header><span class="mark">◈</span><div><strong>Risk<span>Protect</span></strong><small>Link Guard</small></div><i id="statusDot"></i></header><section id="signedOut"><div class="intro"><h1>Safer links, one click earlier.</h1><p>Sign in with your RiskProtect account to check links before they open.</p></div><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button type="submit">Sign in</button></form></section><section id="signedIn" hidden><div class="account"><div><small>PROTECTED AS</small><strong id="userName"></strong><span id="workspace"></span></div><button id="logout" class="link">Sign out</button></div><label class="toggle"><span><strong>Automatic link checks</strong><small>Review external links when you click them</small></span><input id="autoProtect" type="checkbox"><i></i></label><form id="checkForm"><label>Check a link<input id="url" type="url" required placeholder="https://example.com"></label><button type="submit">Check now</button></form><div id="result" hidden><small id="resultLabel"></small><strong id="resultVerdict"></strong><span id="resultMeta"></span></div><details><summary>Connection settings</summary><label>RiskProtect API<input id="apiBase" type="url"></label><button id="saveSettings" class="secondary" type="button">Save connection</button><button id="clearBlocks" class="link danger" type="button">Clear blocked sites</button></details></section><p id="message" role="status"></p></main><script src="popup.js"></script></body></html>
